# Add only a new observation principal; existing Role rules are unchanged.
apiVersion: v1
kind: ServiceAccount
metadata: {name: native-witness, namespace: REPLACE_NAMESPACE}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: native-witness, namespace: REPLACE_NAMESPACE}
subjects:
  - {kind: ServiceAccount, name: native-witness, namespace: REPLACE_NAMESPACE}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: native-observation}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: native-witness-REPLACE_NAMESPACE}
subjects:
  - {kind: ServiceAccount, name: native-witness, namespace: REPLACE_NAMESPACE}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: native-REPLACE_NAMESPACE-identity}
