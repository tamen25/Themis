apiVersion: v1
kind: ServiceAccount
metadata:
  name: themis-controller
  namespace: themis-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: themis-controller
  namespace: themis-test
rules:
  - apiGroups: [verification.themis.dev]
    resources: [verificationruns]
    verbs: [get, list, watch]
  - apiGroups: [verification.themis.dev]
    resources: [verificationruns/status]
    verbs: [update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: themis-controller
  namespace: themis-test
subjects:
  - {kind: ServiceAccount, name: themis-controller, namespace: themis-test}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: themis-controller}
---
# Read exactly two namespace identities; no cluster-wide list/watch or writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: themis-t20-namespace-identities
rules:
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [kube-system, themis-test]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: themis-t20-namespace-identities
subjects:
  - {kind: ServiceAccount, name: themis-controller, namespace: themis-test}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: themis-t20-namespace-identities}
