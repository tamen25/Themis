apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: verificationruns.verification.themis.dev
spec:
  group: verification.themis.dev
  scope: Namespaced
  names:
    plural: verificationruns
    singular: verificationrun
    kind: VerificationRun
    shortNames: [vr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Verdict, type: string, jsonPath: .status.verdict}
        - {name: Reason, type: string, jsonPath: .status.reason}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              # Preserve unknown input until validation; the exact required-key
              # count below then rejects it instead of silently pruning it.
              x-kubernetes-preserve-unknown-fields: true
              maxProperties: 4
              required: [schemaVersion, executionProfile, contract, target]
              properties:
                schemaVersion:
                  type: string
                  enum: [themis.kubernetes-run/v1alpha1]
                executionProfile:
                  type: string
                  enum: [kind-dry-run]
                contract:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  maxProperties: 4
                  required: [schemaVersion, name, assertion, minReplicas]
                  properties:
                    schemaVersion: {type: string, enum: [themis.kubernetes-contract/v1alpha1]}
                    name: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'}
                    assertion: {type: string, enum: [DeploymentAvailable]}
                    minReplicas: {type: integer, format: int32, enum: [1]}
                target:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  maxProperties: 6
                  required: [apiVersion, kind, namespace, name, uid, generation]
                  properties:
                    apiVersion: {type: string, enum: [apps/v1]}
                    kind: {type: string, enum: [Deployment]}
                    namespace: {type: string, enum: [themis-test]}
                    name: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'}
                    uid: {type: string, pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'}
                    generation: {type: integer, format: int64, minimum: 1}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                phase: {type: string, enum: [PLANNED, DENIED, WAITING, INVALIDATED, ERROR]}
                reason: {type: string, maxLength: 128}
                message: {type: string, maxLength: 512}
                verdict: {type: string, enum: [NOT_RUN, INCONCLUSIVE]}
                executionAllowed: {type: boolean, enum: [false]}
                planValid: {type: boolean}
                invalidated: {type: boolean}
                planDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                candidatePlanDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                preview:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Unsigned versioned plan preview, never execution authorization.
                provenance: {type: string, enum: [KUBERNETES_API_PREVIEW_ONLY_NO_EXECUTION_EVIDENCE]}
                conditions:
                  type: array
                  maxItems: 8
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string, maxLength: 64}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string, maxLength: 128}
                      message: {type: string, maxLength: 512}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
