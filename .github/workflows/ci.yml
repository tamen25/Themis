name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal api examples test)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Verify dependencies
        run: go mod verify
      - name: Check dependency metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Static checks
        run: go vet ./...
      - name: Unit and integration tests
        run: go test ./...
      - name: Build
        run: go build -trimpath -o bin/ ./cmd/...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Fuzz contract parsing
        if: runner.os == 'Linux'
        run: go test ./internal/contract -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s
      - name: Fuzz verdict integrity
        if: runner.os == 'Linux'
        run: go test ./internal/result -run '^$' -fuzz '^FuzzAggregateNeverFalsePass$' -fuzztime 10s
      - name: Audit reachable vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Fuzz journal replay
        if: runner.os == 'Linux'
        run: go test ./internal/run -run '^$' -fuzz '^FuzzReplay$' -fuzztime 10s
      - name: Fuzz experiment replay
        if: runner.os == 'Linux'
        run: go test ./internal/experiment -run '^$' -fuzz '^FuzzReplayExperiment$' -fuzztime 10s
      - name: Fuzz Kubernetes dry-run input
        if: runner.os == 'Linux'
        run: go test ./internal/kube -run '^$' -fuzz '^FuzzDryRunSpec$' -fuzztime 10s
      - name: Fuzz Kubernetes journal trust boundary
        if: runner.os == 'Linux'
        run: go test ./internal/kubeexperiment -run '^$' -fuzz '^FuzzKubernetesJournalNeverTrustsPASS$' -fuzztime 10s
      - name: Fuzz coordination index trust boundary
        if: runner.os == 'Linux'
        run: go test ./internal/kubeexperiment -run '^$' -fuzz '^FuzzCoordinationIndexNeverAuthenticatesExecution$' -fuzztime 10s
      - name: Fuzz closed external-provider admission
        if: runner.os == 'Linux'
        run: go test ./internal/chaosmesh -run '^$' -fuzz '^FuzzExternalPlanCannotAuthorizeFault$' -fuzztime 10s
      - name: Fuzz PostgreSQL recovery contracts
        if: runner.os == 'Linux'
        run: |
          go test ./internal/postgres -run '^$' -fuzz '^FuzzContract$' -fuzztime 10s
          go test ./internal/postgres -run '^$' -fuzz '^FuzzDurableContract$' -fuzztime 10s
          go test ./internal/postgres -run '^$' -fuzz '^FuzzPITRUntrustedRecoveryData$' -fuzztime 10s
          go test ./internal/postgres -run '^$' -fuzz '^FuzzReplicationUntrustedEvidence$' -fuzztime 10s

  kind-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: Install pinned Kind
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/tools | Out-Null
          $env:GOBIN = (Resolve-Path .cache/tools).Path
          go install sigs.k8s.io/kind@v0.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create owned disposable cluster
        shell: pwsh
        run: ./scripts/kind-up.ps1
      - name: Real API and controller tests
        shell: pwsh
        run: |
          $env:THEMIS_KIND_KUBECONFIG = (Resolve-Path .themis/kind-t20/kubeconfig).Path
          go test -count=1 -v ./test/kubernetes
          exit $LASTEXITCODE
      - name: Tear down owned cluster
        if: always()
        shell: pwsh
        run: ./scripts/kind-down.ps1

  kind-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: Install pinned Kind
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/tools | Out-Null
          $env:GOBIN = (Resolve-Path .cache/tools).Path
          go install sigs.k8s.io/kind@v0.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create owned synthetic experiment environment
        shell: pwsh
        run: ./scripts/kind-experiment.ps1 -Action up
      - name: Real lifecycle, drift, cancellation, process death, expiry and RBAC
        shell: pwsh
        run: |
          ./scripts/kind-experiment.ps1 -Action test-lifecycle
      - name: Real operator coordination, duplicate starts, drift, crashes and polling
        shell: pwsh
        run: ./scripts/kind-experiment.ps1 -Action test-coordination
      - name: Preserve T2.0 dry-run behavior
        shell: pwsh
        run: |
          $env:THEMIS_KIND_KUBECONFIG = (Resolve-Path .themis/kind-t21/admin-kubeconfig).Path
          $env:THEMIS_KIND_OWNERSHIP_FILE = (Resolve-Path .themis/kind-t21/bootstrap-owner.json).Path
          go test -count=1 -v ./test/kubernetes
          exit $LASTEXITCODE
      - name: Tear down owned experiment cluster
        if: always()
        shell: pwsh
        run: ./scripts/kind-experiment.ps1 -Action down

  kind-external-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: Install pinned Kind
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/tools | Out-Null
          $env:GOBIN = (Resolve-Path .cache/tools).Path
          go install sigs.k8s.io/kind@v0.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create owned schema-only environment
        shell: pwsh
        run: ./scripts/kind-chaosmesh.ps1 -Action up
      - name: Actual schema, planning and permission negatives
        shell: pwsh
        run: ./scripts/kind-chaosmesh.ps1 -Action test
      - name: Tear down owned schema-only environment
        if: always()
        shell: pwsh
        run: ./scripts/kind-chaosmesh.ps1 -Action down
